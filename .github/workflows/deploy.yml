name: Deploy to AWS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Astro checks
        run: pnpm check

      - name: Run project lint
        run: pnpm lint:house

      - name: Build site
        run: pnpm build

            - name: Verify CSP inline script hash
        run: |
          EXPECTED_HASH="Bjj/TFrNJlmrwf3ZovlU3xOOuq33roauhi2llG7aE9g="

          ACTUAL_HASH=$(python3 - <<'PY'
          import re
          import hashlib
          import base64
          from pathlib import Path

          html = Path("dist/index.html").read_text()

          scripts = re.findall(
              r'<script(?![^>]*\bsrc=)(?![^>]*type=["\']application/ld\+json["\'])[^>]*>(.*?)</script>',
              html,
              flags=re.DOTALL | re.IGNORECASE,
          )

          if len(scripts) != 1:
              raise SystemExit(
                  f"Expected exactly 1 executable inline script, found {len(scripts)}"
              )

          digest = hashlib.sha256(scripts[0].encode()).digest()
          print(base64.b64encode(digest).decode())
          PY
          )

          echo "Expected CSP hash: $EXPECTED_HASH"
          echo "Generated CSP hash: $ACTUAL_HASH"

          if [ "$ACTUAL_HASH" != "$EXPECTED_HASH" ]; then
            echo "::error::Inline script changed. Update and review the CloudFront CSP before deploying."
            exit 1
          fi  

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: github-actions-${{ github.run_id }}

      - name: Deploy immutable Astro assets
        run: |
          aws s3 sync dist/_astro/ s3://${{ vars.AWS_S3_BUCKET }}/_astro/ \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Deploy site
        run: |
          aws s3 sync dist/ s3://${{ vars.AWS_S3_BUCKET }}/ \
            --delete \
            --exclude "_astro/*" \
            --exclude ".DS_Store" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.AWS_CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"